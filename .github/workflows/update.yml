name: update
on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC
  workflow_dispatch:        # manueller Start-Knopf
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python scrape.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || (git commit -m "update events" && git push)
