<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veranstaltungen</title>
<script>try{var r=document.documentElement,t=localStorage.getItem('theme'),a=localStorage.getItem('accent');if(t==='light'||t==='dark')r.setAttribute('data-theme',t);if(a)r.setAttribute('data-accent',a)}catch(e){}</script>
<style>
:root{--bg:#eceeef;--fg:#3b4048;--mut:#646c77;--line:#c5cad0;--accfg:#fff;--pop:#f7f8f9;
  --tb:91%;--ts:60%;--tf:26%;--onl:38%;--onfg:#fff;color-scheme:light;
  --a-cyan:#0c6f7e;--a-magenta:#a3219f;--a-orange:#a8480a;--a-pink:#be185d;--a-indigo:#3a39c8;--acc:var(--a-cyan)}
:root[data-theme=dark]{--bg:#13151a;--fg:#b9bfc8;--mut:#858d98;--line:#2c313a;--accfg:#13151a;--pop:#1b1e24;
  --tb:24%;--ts:38%;--tf:84%;--onl:66%;--onfg:#111;color-scheme:dark;
  --a-cyan:#5cc8d6;--a-magenta:#e07fde;--a-orange:#f0a45e;--a-pink:#f48fb8;--a-indigo:#9a98ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13151a;--fg:#b9bfc8;--mut:#858d98;--line:#2c313a;--accfg:#13151a;--pop:#1b1e24;
  --tb:24%;--ts:38%;--tf:84%;--onl:66%;--onfg:#111;color-scheme:dark;
  --a-cyan:#5cc8d6;--a-magenta:#e07fde;--a-orange:#f0a45e;--a-pink:#f48fb8;--a-indigo:#9a98ff}}
:root[data-accent=magenta]{--acc:var(--a-magenta)}
:root[data-accent=orange]{--acc:var(--a-orange)}
:root[data-accent=pink]{--acc:var(--a-pink)}
:root[data-accent=indigo]{--acc:var(--a-indigo)}
*{box-sizing:border-box}
button,label{touch-action:manipulation}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1rem 4rem}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-bottom:1rem}
h1{font-size:1.9rem;letter-spacing:-.02em;margin:0;overflow-wrap:normal}
button,input{font:inherit;color:var(--fg)}
.design{position:relative;margin-left:auto}
.theme{white-space:nowrap;font-size:.85rem;padding:.2rem .7rem;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.panel{position:absolute;right:0;top:calc(100% + .4rem);z-index:5;display:grid;gap:.7rem;min-width:15rem;padding:.8rem;
  background:var(--pop);border:1px solid var(--line);border-radius:10px}
.prow{display:grid;gap:.3rem;font-size:.85rem;color:var(--mut)}
.seg{display:flex}
.seg button{flex:1;padding:.25rem .5rem;border:1px solid var(--line);background:none;cursor:pointer;font-size:.9rem}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button+button{border-left:0}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.sws{display:flex;gap:.6rem}
.sw{width:1.7rem;height:1.7rem;border-radius:50%;border:0;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}
input[type=search],input[type=date]{padding:.4rem .7rem;border:1px solid var(--line);border-radius:6px;background:none}
input[type=search]{width:100%;margin-bottom:.8rem}
input[type=date]{padding:.15rem .4rem;font-size:.9rem}
.grp{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:0 .6rem;align-items:start;margin-bottom:.3rem}
.gl{font-weight:600;color:var(--mut);font-size:.9rem;padding-top:.3rem}
.cnt{display:block;font-weight:400;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.15rem 0 .35rem}
.chip,.inv{font-size:.9rem;padding:.2rem .7rem;border:1px solid var(--line);border-radius:99px;background:none;cursor:pointer}
.inv{border-style:dashed;color:var(--mut)}
.inv[aria-pressed=true]{background:var(--fg);color:var(--bg);border-style:solid}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.chip.hue{border-color:hsl(var(--h) 45% var(--onl))}
.chip.hue.on{background:hsl(var(--h) 55% var(--onl));border-color:hsl(var(--h) 55% var(--onl));color:var(--onfg)}
.ex .chip.on,.ex .chip.hue.on{background:none;border:1px dashed var(--mut);color:var(--mut);text-decoration:line-through}
.dl{display:inline-flex;align-items:center;gap:.3rem;font-size:.9rem;color:var(--mut)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:1rem 0 .5rem;color:var(--mut);font-size:.9rem}
.reset{background:none;border:0;color:var(--acc);cursor:pointer;text-decoration:underline}
.day{content-visibility:auto;contain-intrinsic-size:auto 7rem;display:grid;grid-template-columns:4.5rem minmax(0,1fr);gap:0 1rem;border-top:1px solid var(--line);padding:.9rem 0}
.date{position:sticky;top:.5rem;align-self:start}
.date b{display:block;font-size:2.2rem;line-height:1;font-weight:800;color:var(--acc)}
.date span{font-size:.85rem;color:var(--mut)}
.ev{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:0 .5rem;padding:.35rem 0 .8rem}
.ev h3{font-size:1.05rem;margin:0}
.ev a{color:inherit}
.time{font-variant-numeric:tabular-nums;color:var(--mut)}
.mut{color:var(--mut);font-size:.9rem}
.ev p{margin:.3rem 0 0;font-size:.92rem;max-width:62ch}
.tag{display:inline-block;margin:.25rem .3rem 0 0;padding:0 .55rem;border-radius:4px;font-size:.8rem;background:var(--line);color:var(--mut)}
.tag.hue{background:hsl(var(--h) var(--ts) var(--tb));color:hsl(var(--h) 60% var(--tf))}
.gone h3{text-decoration:line-through}
.feeds{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:.8rem}
.feeds>summary{cursor:pointer;font-weight:600}
.feeds .hint{margin:.6rem 0}
.fl{display:flex;flex-wrap:wrap;gap:.2rem 1rem;margin:.4rem 0}
.fl b{flex:0 0 100%;font-size:.85rem;color:var(--mut);font-weight:600}
.fl a{color:var(--acc)}
@media(max-width:30rem){h1{font-size:1.55rem}.day{grid-template-columns:3.2rem minmax(0,1fr)}.date b{font-size:1.6rem}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Veranstaltungen</h1>
  <div class="design">
    <button class="theme" id="theme" type="button" aria-expanded="false" aria-controls="dpanel">Design</button>
    <div class="panel" id="dpanel" hidden>
      <div class="prow">Modus<div class="seg" id="seg">
        <button type="button" data-v="auto">Auto</button><button type="button" data-v="light">Hell</button><button type="button" data-v="dark">Dunkel</button></div></div>
      <div class="prow">Farbe<div class="sws" id="sws"></div></div>
    </div>
  </div>
</div>
<input type="search" id="q" placeholder="Suchen (Titel, Ort, Genre, Beschreibung)" aria-label="Suchen">
<div class="grp"><div class="gl">Wann</div><div class="chips" id="when">
  <label class="dl">von <input type="date" id="from"></label><label class="dl">bis <input type="date" id="to"></label></div></div>
<div class="grp" id="g-city"><div class="gl">Stadt <span class="cnt"></span></div><div class="chips"><button class="inv" type="button" title="Auswahl umkehren">Invertieren</button></div></div>
<div class="grp" id="g-venue"><div class="gl">Ort <span class="cnt"></span></div><div class="chips"><button class="inv" type="button" title="Auswahl umkehren">Invertieren</button></div></div>
<div class="grp" id="g-tag"><div class="gl">Art <span class="cnt"></span></div><div class="chips"><button class="inv" type="button" title="Auswahl umkehren">Invertieren</button></div></div>
<div class="bar"><span id="count"></span><button class="reset" id="reset" type="button">Zurücksetzen</button></div>
<div id="list"></div>
<details class="feeds">
  <summary>Kalender-Abos</summary>
  <p class="mut hint">Link kopieren und im Kalender als Abo hinzufügen (nicht herunterladen). Stand: <span id="gen"></span></p>
  <div id="feeds"></div>
</details>
</main>
<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);Object.assign(e,a);e.append(...k);return e};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
const HUE={'konzert':225,'jam-session':140,'theater':350,'lesung':40,'party':300,'film':185,'workshop':20,'ausstellung':270};
const KEYS=[['city','stadt'],['venue','ort'],['tag','art']];
const GR={city:'#g-city',venue:'#g-venue',tag:'#g-tag'};
const sel={city:new Set(),venue:new Set(),tag:new Set()};
const mode={city:'in',venue:'in',tag:'in'};   // intern: "in" = nur Markierte, "ex" = alle außer Markierten
const rng={from:'',to:''};
let D,V;

/* ---------- Design-Panel ---------- */
const ACC=[['cyan','Cyan'],['magenta','Magenta'],['orange','Orange'],['pink','Pink'],['indigo','Indigo']];
let th='auto',ac='cyan';
try{th=localStorage.getItem('theme')||'auto';ac=localStorage.getItem('accent')||'cyan'}catch(e){}
function applyDesign(){
  const r=document.documentElement;
  th==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',th);
  r.setAttribute('data-accent',ac);
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===th));
  document.querySelectorAll('#sws .sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ac));
}
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
for(const[v,l]of ACC){
  const b=el('button',{className:'sw',type:'button',title:l});b.dataset.v=v;b.setAttribute('aria-label',l);b.style.setProperty('--c','var(--a-'+v+')');
  b.onclick=()=>{ac=v;save('accent',v);applyDesign()};$('#sws').append(b);
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{th=b.dataset.v;save('theme',th);applyDesign()});
const panel=$('#dpanel');
function togglePanel(open){panel.hidden=!open;$('#theme').setAttribute('aria-expanded',open)}
$('#theme').onclick=()=>togglePanel(panel.hidden);
document.addEventListener('click',e=>{if(!e.target.closest('.design'))togglePanel(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')togglePanel(false)});
applyDesign();

/* ---------- Datum / Schnellfilter ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const PRESETS=[
  ['Heute',()=>{const t=new Date();return[iso(t),iso(t)]}],
  ['Wochenende',()=>{const t=new Date(),sun=addDays(t,(7-t.getDay())%7),fri=addDays(sun,-2);return[iso(fri<t?t:fri),iso(sun)]}],
  ['7 Tage',()=>{const t=new Date();return[iso(t),iso(addDays(t,6))]}]];
const presetEls=[];
for(const[label,fn]of [...PRESETS].reverse()){
  const b=el('button',{className:'chip',type:'button',textContent:label});b._fn=fn;presetEls.push(b);
  b.onclick=()=>{const[f,t]=fn();const on=rng.from===f&&rng.to===t;rng.from=on?'':f;rng.to=on?'':t;$('#from').value=rng.from;$('#to').value=rng.to;render()};
  $('#when').prepend(b);
}
$('#from').oninput=e=>{rng.from=e.target.value;render()};
$('#to').oninput=e=>{rng.to=e.target.value;render()};
let qt=0;$('#q').oninput=()=>{clearTimeout(qt);qt=setTimeout(render,120)};

/* ---------- Filter ---------- */
const GRN={};
function chips(key,items){
  const root=$(GR[key]),box=root.querySelector('.chips');
  const g=GRN[key]={root,inv:root.querySelector('.inv'),cnt:root.querySelector('.cnt'),chips:[]};
  for(const[val,label,city]of items){
    const b=el('button',{className:'chip',textContent:label,type:'button'});
    b.dataset.val=val;if(city)b.dataset.city=city;
    if(key==='tag'&&HUE[val]!==undefined){b.classList.add('hue');b.style.setProperty('--h',HUE[val])}
    b.onclick=()=>{sel[key].has(val)?sel[key].delete(val):sel[key].add(val);render()};
    g.chips.push(b);box.append(b);
  }
  g.inv.onclick=()=>{mode[key]=mode[key]==='in'?'ex':'in';render()};
}
// Leere Auswahl = kein Filter. "in": nur Markierte. "ex" (Invertieren): alle außer den durchgestrichenen.
const ok=(key,hit)=>!sel[key].size||(mode[key]==='in')===hit;
function paint(){
  for(const k in sel){
    const g=GRN[k],ex=mode[k]==='ex',n=sel[k].size;
    g.root.classList.toggle('ex',ex);g.inv.setAttribute('aria-pressed',ex);
    for(const c of g.chips)c.classList.toggle('on',sel[k].has(c.dataset.val));
    g.cnt.textContent=n?(ex?'ohne '+n:n+' gewählt'):'';
  }
  for(const c of GRN.venue.chips){const h=!ok('city',sel.city.has(c.dataset.city));if(c.hidden!==h)c.hidden=h}
  for(const c of presetEls){const p=c._fn();c.classList.toggle('on',rng.from===p[0]&&rng.to===p[1])}
}
$('#reset').onclick=()=>{
  for(const k in sel){sel[k].clear();mode[k]='in'}
  rng.from=rng.to='';$('#from').value=$('#to').value=$('#q').value='';render();
};

/* ---------- URL-Zustand (#stadt=…&ort=…&art=-party&q=…&von=…&bis=…) ---------- */
let ht=0;
const scheduleHash=()=>{clearTimeout(ht);ht=setTimeout(saveHash,250)};
function saveHash(){
  const p=[];
  for(const[k,n]of KEYS)if(sel[k].size)p.push(n+'='+(mode[k]==='ex'?'-':'')+[...sel[k]].map(encodeURIComponent).join(','));
  const q=$('#q').value.trim();if(q)p.push('q='+encodeURIComponent(q));
  if(rng.from)p.push('von='+rng.from);if(rng.to)p.push('bis='+rng.to);
  try{history.replaceState(null,'',location.pathname+location.search+(p.length?'#'+p.join('&'):''))}catch(e){}
}
function loadHash(){
  for(const k in sel){sel[k].clear();mode[k]='in'}rng.from=rng.to='';$('#q').value='';
  const known={city:new Set(D.venues.map(v=>v.city)),venue:new Set(D.venues.map(v=>v.id)),tag:new Set(D.tags_used)};
  const dre=/^\d{4}-\d\d-\d\d$/;
  for(const part of location.hash.slice(1).split('&')){
    const i=part.indexOf('=');if(i<1)continue;
    const n=part.slice(0,i),raw=part.slice(i+1),k=KEYS.find(x=>x[1]===n);
    if(k){let v=raw;if(v[0]==='-'){mode[k[0]]='ex';v=v.slice(1)}
      v.split(',').map(dec).filter(x=>known[k[0]].has(x)).forEach(x=>sel[k[0]].add(x))}
    else if(n==='q')$('#q').value=dec(raw);
    else if(n==='von'&&dre.test(raw))rng.from=raw;
    else if(n==='bis'&&dre.test(raw))rng.to=raw;
  }
  $('#from').value=rng.from;$('#to').value=rng.to;
}

/* ---------- Liste: einmal bauen, beim Filtern nur ein-/ausblenden ---------- */
const days=[];
const dfmt=new Intl.DateTimeFormat('de-DE',{weekday:'short',month:'short'});
function mkEvent(e,v){
  const title=/^https?:\/\//.test(e.url||'')?el('a',{href:e.url,textContent:e.title,rel:'noopener'}):document.createTextNode(e.title);
  const info=el('div',{},el('h3',{},title),
    el('div',{className:'mut',textContent:(e.location_override||v.name+', '+v.city)+(e.genre?' – '+e.genre:'')+(e.gone?' – evtl. entfallen':'')}));
  for(const t of e.tags){
    const s=el('span',{className:'tag',textContent:t});
    if(HUE[t]!==undefined){s.classList.add('hue');s.style.setProperty('--h',HUE[t])}
    info.append(s);
  }
  if(e.description)info.append(el('p',{textContent:e.description}));
  return el('article',{className:'ev'+(e.gone?' gone':'')},el('div',{className:'time',textContent:e.time_known?e.time:''}),info);
}
function build(){
  const root=$('#list');let day;
  for(const e of D.events){
    if(!day||day.date!==e.date){
      const d=new Date(e.date+'T12:00'),box=el('div');
      const section=el('section',{className:'day'},
        el('div',{className:'date'},el('b',{textContent:d.getDate()}),el('span',{textContent:dfmt.format(d)})),box);
      day={date:e.date,section,box,items:[]};days.push(day);root.append(section);
    }
    const v=V[e.venue_id];
    const node=mkEvent(e,v);day.box.append(node);
    day.items.push({e,node,hay:[e.title,v.name,v.city,e.genre,e.description].join(' ').toLowerCase()});
  }
  root.append(el('p',{id:'empty',className:'mut',hidden:true,textContent:'Keine Veranstaltungen für diese Auswahl.'}));
}
function render(){
  paint();
  const q=$('#q').value.trim().toLowerCase(),today=iso(new Date());
  let total=0;
  for(const d of days){
    let n=0;
    for(const it of d.items){
      const e=it.e,v=V[e.venue_id];
      const show=e.date>=today&&(!rng.from||e.date>=rng.from)&&(!rng.to||e.date<=rng.to)
        &&ok('city',sel.city.has(v.city))&&ok('venue',sel.venue.has(e.venue_id))&&ok('tag',e.tags.some(t=>sel.tag.has(t)))
        &&(!q||it.hay.includes(q));
      if(it.node.hidden===show)it.node.hidden=!show;
      if(show)n++;
    }
    const sh=n===0;if(d.section.hidden!==sh)d.section.hidden=sh;
    total+=n;
  }
  $('#count').textContent=total+(total===1?' Veranstaltung':' Veranstaltungen');
  $('#empty').hidden=total>0;
  scheduleHash();
}
fetch('events.json').then(r=>r.json()).then(d=>{
  D=d;V=Object.fromEntries(d.venues.map(v=>[v.id,v]));
  chips('city',[...new Set(d.venues.map(v=>v.city))].sort().map(c=>[c,c]));
  chips('venue',d.venues.map(v=>[v.id,v.name,v.city]));
  chips('tag',d.tags_used.map(t=>[t,t]));
  feeds();build();$('#gen').textContent=new Date(d.generated).toLocaleString('de-DE');
  loadHash();render();
  addEventListener('hashchange',()=>{loadHash();render()});
}).catch(e=>{$('#list').textContent='events.json konnte nicht geladen werden. Lief der Workflow schon? ('+e+')'});
function feeds(){
  const box=$('#feeds');
  const row=(label,items)=>box.append(el('div',{className:'fl'},el('b',{textContent:label}),
    ...items.map(([n,l])=>el('a',{href:'feeds/'+n+'.ics',textContent:l}))));
  row('Alle',[['all','Alle Veranstaltungen']]);
  row('Stadt',[...new Set(D.venues.map(v=>v.city))].sort().map(c=>['stadt-'+slug(c),c]));
  row('Art',D.tags_used.map(t=>['tag-'+slug(t),t]));
  row('Ort',D.venues.map(v=>['venue-'+slug(v.id),v.name]));
}
</script>
</body>
</html>
